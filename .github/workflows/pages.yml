name: Deploy Ex Libris

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the project
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install the browser used by the gate
        run: npx playwright install --with-deps chromium

      - name: Verify the complete application
        run: npm run gate

      - name: Retain failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build for the project site
        run: npm run build
        env:
          VITE_BASE_PATH: /Ex-Libris/

      - name: Restore the checked production catalogue
        run: npm run pages:corpus:assemble

      - name: Verify the exact public artifact
        run: npm run check:release

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the exact site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
