<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The app icon.

    Assembled, not invented: this is the bookplate frame from
    design/Ex Libris.dc.html — three nested rules, a corner diamond on each
    side, four tick marks where the band rules meet the frame — scaled to a
    square and set on the dark page colour. No new shape and no new idea.

    Colours are the dark palette's literal values because a launcher icon sits
    outside the app and cannot resolve a custom property:
      #212631  --surface-base
      #8FA3C4  --accent
      #667085  --text-faint

    Claude Design never produced an icon. This one is deliberately the most
    conservative thing that could be made from the existing vocabulary, and it
    is the one piece of Phase 0 that wants the owner's eye. See
    docs/OPEN-QUESTIONS.md Q-018.
  -->
  <rect width="512" height="512" fill="#212631"/>
  <g fill="none" stroke-width="4">
    <rect x="56" y="56" width="400" height="400" rx="6" stroke="#667085"/>
    <rect x="80" y="80" width="352" height="352" rx="4" stroke="#8FA3C4" stroke-width="3"/>
    <rect x="92" y="92" width="328" height="328" rx="4" stroke="#8FA3C4" stroke-width="3"/>
    <path d="M92 186 L420 186 M92 326 L420 326" stroke="#8FA3C4" stroke-width="3"/>
    <path d="M148 186 L148 168 M364 186 L364 168 M148 326 L148 344 M364 326 L364 344" stroke="#8FA3C4" stroke-width="3"/>
  </g>
  <g fill="#8FA3C4">
    <path d="M256 60 L272 80 L256 100 L240 80 Z"/>
    <path d="M256 412 L272 432 L256 452 L240 432 Z"/>
    <path d="M60 256 L80 240 L100 256 L80 272 Z"/>
    <path d="M452 256 L432 240 L412 256 L432 272 Z"/>
  </g>
  <!-- The band the wordmark occupies on the real bookplate, left as the plate's
       own negative space rather than filled with initials that would be a new
       mark the design never approved. -->
  <g fill="#8FA3C4" opacity="0.9">
    <rect x="176" y="243" width="160" height="4" rx="2"/>
    <rect x="204" y="264" width="104" height="4" rx="2" opacity="0.55"/>
  </g>
</svg>
